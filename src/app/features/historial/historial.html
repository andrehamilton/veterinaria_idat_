<div class="container py-4">
  <h2 class="mb-4">
    <i class="bi bi-clipboard2-pulse"></i>
    Historial médico
  </h2>

  <div *ngIf="mensaje" class="alert alert-success">
    {{ mensaje }}
  </div>

  <form [formGroup]="formulario" (ngSubmit)="registrar()" class="card card-body shadow-sm mb-4">
    <div class="mb-3">
      <label class="form-label">Diagnóstico</label>
      <select class="form-select" formControlName="diagnostico">
        <option value="">Selecciona un diagnóstico</option>
        <option *ngFor="let diagnostico of diagnosticos" [value]="diagnostico">{{ diagnostico }}</option>
      </select>
    </div>

    <div class="mb-3" *ngIf="formulario.controls.diagnostico.value === 'Otro'">
      <label class="form-label" for="otroDiagnostico">Especifica el tipo de diagnóstico</label>
      <input id="otroDiagnostico" class="form-control" type="text"
             formControlName="otroDiagnostico"
             placeholder="Escribe el diagnóstico">
      <div class="text-danger small"
           *ngIf="formulario.controls.otroDiagnostico.touched && !formulario.controls.otroDiagnostico.value.trim()">
        Especifica el tipo de diagnóstico.
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Fecha de atención</label>
      <input type="date" class="form-control" formControlName="fecha">
    </div>

    <div class="mb-3">
      <label class="form-label">Mascota</label>
      <select class="form-select" formControlName="mascotaId" (change)="consultar()">
        <option [ngValue]="0">Selecciona una mascota</option>
        <option *ngFor="let mascota of mascotas" [ngValue]="mascota.id">
          {{ mascota.nombre }} — {{ mascota.propietarioDni }}
        </option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Tratamiento</label>
      <textarea class="form-control" rows="2" formControlName="tratamiento"></textarea>
    </div>

    <button type="submit" class="btn btn-success" [disabled]="mascotas.length === 0">
      Registrar atención
    </button>
  </form>

  <h3 class="mb-3">Atenciones anteriores</h3>

  <div class="card shadow-sm">
    <div class="card-body table-responsive">
      <table class="table table-striped table-hover align-middle">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Diagnóstico</th>
            <th>Tratamiento</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let atencion of atenciones">
            <td>{{ atencion.fecha }}</td>
            <td>{{ atencion.diagnostico }}</td>
            <td>{{ atencion.tratamiento }}</td>
          </tr>
          <tr *ngIf="atenciones.length === 0">
            <td colspan="3" class="text-center text-muted py-4">
              No hay atenciones registradas para esta mascota.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
